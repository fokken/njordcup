[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "njordcup"
version = "0.1.0"
description = "Bounded, evidence-based AI security review for local repositories"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
njordcup = "njordcup.cli:main"

[tool.setuptools.packages.find]
include = ["njordcup*"]
